<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Job Search Harness</title>
  <desc id="desc">Three connected cards illustrate matching a role, preparing an application, and following up.</desc>
  <defs>
    <linearGradient id="back" x2="1" y2="1">
      <stop stop-color="#102c30"/>
      <stop offset="1" stop-color="#184044"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#b6efe1" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="24" fill="url(#back)"/>
  <rect x="680" y="20" width="500" height="360" fill="url(#dots)"/>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="64" y="57" width="150" height="34" rx="17" fill="#29494a" stroke="#477067"/>
    <circle cx="84" cy="74" r="4" fill="#b0f1c9"/>
    <text x="98" y="79" font-size="13" font-weight="650" letter-spacing="2" fill="#d8f8e6">LOCAL FIRST</text>
    <text x="60" y="170" font-size="70" font-weight="740" letter-spacing="-3" fill="#f8fcf8">Job Search</text>
    <text x="60" y="246" font-size="70" font-weight="740" letter-spacing="-3" fill="#b9f0ce">Harness</text>
    <text x="65" y="312" font-size="23" fill="#d7e8e5">A clearer way to move your search forward.</text>
    <path d="M856 120h84v78h-94v79h100" fill="none" stroke="#7ae2b3" stroke-opacity=".75" stroke-width="2.5" stroke-dasharray="6 7"/>
    <circle cx="940" cy="198" r="5" fill="#b9f0ce"/>
    <circle cx="846" cy="277" r="5" fill="#b9f0ce"/>
    <g>
      <rect x="679" y="74" width="233" height="83" rx="14" fill="#e9faf0"/>
      <rect x="696" y="94" width="42" height="42" rx="11" fill="#d1efdd"/>
      <circle cx="716" cy="113" r="6.3" fill="none" stroke="#27584e" stroke-width="2.5"/>
      <path d="m721 118 5 5" stroke="#27584e" stroke-width="2.5" stroke-linecap="round"/>
      <text x="752" y="109" font-size="18" font-weight="700" fill="#183831">Find a fit</text>
      <text x="752" y="131" font-size="13" fill="#40645b">Roles &amp; match reasons</text>
    </g>
    <g>
      <rect x="924" y="155" width="228" height="83" rx="14" fill="#f3f7f2"/>
      <rect x="942" y="175" width="42" height="42" rx="11" fill="#dfede2"/>
      <path d="M955 186h16v20h-16zm4 6h8m-8 5h8" fill="none" stroke="#27584e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="998" y="190" font-size="18" font-weight="700" fill="#183831">Prepare</text>
      <text x="998" y="212" font-size="13" fill="#40645b">Draft &amp; attachment</text>
    </g>
    <g>
      <rect x="752" y="256" width="233" height="83" rx="14" fill="#c7efdc"/>
      <rect x="770" y="276" width="42" height="42" rx="11" fill="#b3e5ca"/>
      <path d="M782 288h18v12h-11l-5 4v-4h-2z" fill="none" stroke="#27584e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="826" y="291" font-size="18" font-weight="700" fill="#183831">Follow through</text>
      <text x="826" y="313" font-size="13" fill="#40645b">Replies &amp; next decisions</text>
    </g>
  </g>
</svg>
