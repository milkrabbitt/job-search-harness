name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.9'
          - os: ubuntu-24.04
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Windows time zone data
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Check POSIX runtime
        if: runner.os != 'Windows'
        run: ./scripts/doctor.sh
      - name: Check Windows installation scripts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JOB_HARNESS_DATA_DIR: ${{ runner.temp }}/job-harness-demo
        run: |
          ./scripts/bootstrap.ps1 -Demo -InstallTimezone
          ./scripts/doctor.ps1
      - run: python -B -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools (not runtime dependencies)
        run: |
          python -m pip install -r requirements.txt playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Exercise the first-run UI with fictional data
        env:
          JOB_HARNESS_SCREENSHOTS: ${{ runner.temp }}/job-harness-ui
        run: python scripts/browser-smoke.py
      - name: Exercise PDF profile, salary comparison and interview handoff
        env:
          JOB_HARNESS_SCREENSHOTS: ${{ runner.temp }}/job-harness-workflow
        run: python scripts/browser-workflow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-browser-screenshots
          path: |
            ${{ runner.temp }}/job-harness-ui
            ${{ runner.temp }}/job-harness-workflow
          if-no-files-found: ignore
