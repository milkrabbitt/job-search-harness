name: Sync v0.1.0 release notes

on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.1.0.md'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-notes-v0.1.0
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'milkrabbitt/job-search-harness' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Read versioned copy and update the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/job-harness-release-notes.md"
          gh api "repos/$GITHUB_REPOSITORY/contents/docs/releases/v0.1.0.md?ref=$GITHUB_SHA" \
            --jq '.content' | base64 --decode > "$notes_file"
          python3 - "$notes_file" <<'PY'
          from pathlib import Path
          import sys
          body = Path(sys.argv[1]).read_text(encoding="utf-8")
          assert 1000 < len(body) < 15000, "Unexpected release-note length"
          assert body.count('```') == 2, "Broken installation code fence"
          assert body.count('git clone https://github.com/milkrabbitt/job-search-harness.git') == 1, "Duplicated installation content"
          assert '虚构' in body and '预览版' in body
          PY
          gh release edit v0.1.0 --repo "$GITHUB_REPOSITORY" \
            --title 'v0.1.0 · Job Search Harness 预览版' \
            --notes-file "$notes_file"
